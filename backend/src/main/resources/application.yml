server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:job_data}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456ppoo}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  ai:
    openai:
      api-key: ${AI_DASHSCOPE_API_KEY:}
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: ${AI_CHAT_MODEL:qwen3.5-omni-plus-2026-03-15}
          temperature: 0.7
          top-p: 0.9
          max-tokens: 1024
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-v3}

    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: ${AI_EMBEDDING_DIM:1024}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

bailian:
  apiKey: ${AI_DASHSCOPE_API_KEY}
  baseUrl: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
  model: "qwen3.5-omni-plus-2026-03-15"
  timeoutMs: 60000
